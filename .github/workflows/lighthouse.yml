name: Lighthouse CI

# P2-2b: Performance budget gate is now BLOCKING.
# Thresholds (see .lighthouserc.json):
#   - performance:    warn  >= 0.70  (non-blocking warning)
#   - accessibility:  error >= 0.85  (BLOCKING — must pass)
#   - seo:            warn  >= 0.80  (non-blocking warning)
# Rationale: a11y is the only hard gate; perf/seo emit warnings only. After
# LCP fixes (removed `unoptimized: true`, added `priority` to hero images),
# the perf budget of 0.70 is comfortably achievable. If LHCI starts failing
# unexpectedly, re-soften by adding `continue-on-error: true` to the LHCI step
# while the issue is investigated — do NOT lower the a11y threshold.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI (perf budget)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # CI dummy Firebase env (mirrors ci.yml verify job).
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-dummy-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '0'
          NEXT_PUBLIC_FIREBASE_APP_ID: 'ci-app'

      - name: Start Next.js server (background)
        run: npm start &
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-dummy-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '0'
          NEXT_PUBLIC_FIREBASE_APP_ID: 'ci-app'

      - name: Wait for server
        run: npx --yes wait-on http://127.0.0.1:3000 --timeout 120000

      - name: Run Lighthouse CI
        # P2-2b: blocking gate. Only a11y (error >= 0.85) can fail the job;
        # perf/seo are warnings per .lighthouserc.json.
        run: npx --yes @lhci/cli@0.13.x autorun
