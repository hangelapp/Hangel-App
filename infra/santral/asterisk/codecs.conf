;==============================================================================
; hangel — Opus kodek ince ayarı (codecs.conf)
;------------------------------------------------------------------------------
; Ses kalitesini artıran en etkili ayarlar burada. Özellikle in-band FEC,
; dalgalı internette (STK'ların çoğu) ses kopmasını dramatik azaltır.
;
; setup.sh bu dosyayı /etc/asterisk/codecs.conf olarak yazar; codec_opus.so
; yüklüyse Asterisk açılışta okur. (Modül yoksa satırlar yok sayılır — güvenli.)
;==============================================================================

[opus]
; In-band Forward Error Correction — kaybolan paketleri komşu paketlerden
; kurtarır. Dalgalı hatlarda "kes kes / robotik ses"i büyük ölçüde giderir.
useinbandfec=yes

; Discontinuous Transmission — konuşulmayan anlarda paket göndermez (bant
; genişliği tasarrufu). Konforlu gürültü ile sessizlik doğal duyulur.
dtx=yes

; Hedef bitrate: 'auto' hattın durumuna göre uyarlanır (kalite/bant dengesi).
bitrate=auto

; Karşı tarafın (tarayıcı) sinyallediği paket kaybı yüzdesine göre FEC'i
; agresifleştir — kayıp arttıkça daha çok koruma.
packet_loss=10

; Playback örnekleme hızı üst sınırı — tam bant (fullband) ses.
max_playback_rate=48000
