;==============================================================================
; hangel — Santral PJSIP konfigürasyonu (WebRTC <-> SIP geçidi)
;------------------------------------------------------------------------------
; Bu dosya bir ŞABLONDUR. setup.sh, santral.env içindeki ${VAR} değişkenlerini
; envsubst ile yerleştirip sonucu /etc/asterisk/pjsip.conf olarak yazar.
;
; Çok-kiracılı tasarım:
;   - Her kiracının tarayıcı (WebRTC) endpoint'i kendi context'ine düşer.
;   - Her kiracının operatör trunk'ı ayrı tanımlanır.
;   - Yeni kiracı eklemek için tenants/ altındaki desen kopyalanır.
;==============================================================================

;==============================================================================
; TRANSPORTLAR
;==============================================================================

; --- WSS (Secure WebSocket) — tarayıcı (SIP.js) buraya bağlanır ---------------
; SIP.js WSS bağlantısı 443/TCP üzerinden gelir. TLS sertifikası Let's Encrypt.
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:443
cert_file=/etc/letsencrypt/live/${DOMAIN}/fullchain.pem
priv_key_file=/etc/letsencrypt/live/${DOMAIN}/privkey.pem
method=tlsv1_2
; external_media_address / external_signaling_address: VM dış IP otomatik
; ICE ile çözülür; NAT arkasındaysa setup.sh STUN ile keşfedebilir.

; --- UDP — operatör trunk'larıyla konuşmak için (Pasifik 5060/UDP) ------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

;==============================================================================
; KİRACI 1: Sosyal Fayda Derneği
;==============================================================================

;------------------------------------------------------------------------------
; (b) Tarayıcı (WebRTC) endpoint'i — SIP.js client
;     WebRTC zorunlulukları: DTLS-SRTP, ICE, rtcp-mux, AVPF, opus.
;------------------------------------------------------------------------------
[tenant1-webrtc](!)
type=endpoint
context=tenant1-from-browser
disallow=all
allow=opus,ulaw,alaw
; --- WebRTC medya katmanı ---
webrtc=yes               ; Asterisk kısayolu: dtls/ice/rtcp-mux/avpf/rtp_symmetric'i açar
dtls_verify=fingerprint
dtls_setup=actpass
ice_support=yes          ; ICE (STUN/TURN ile NAT geçişi)
rtcp_mux=yes             ; RTP+RTCP tek port (tarayıcı zorunluluğu)
media_encryption=dtls    ; DTLS-SRTP
use_avpf=yes             ; AVPF profili (tarayıcı zorunluluğu)
media_use_received_transport=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes      ; WSS arkasındaki tarayıcının gerçek kaynağına yaz
dtmf_mode=auto           ; tarayıcı IVR tuşları: RFC4733 varsa onu, yoksa inband
; --- Ses kalitesi ---
; trust_id_inbound: karşı taraf kimlik başlıklarına güven (transcoding kararları).
trust_id_inbound=yes

[tenant1-webrtc-100](tenant1-webrtc)
type=endpoint
auth=tenant1-webrtc-100-auth
aors=tenant1-webrtc-100-aor
callerid=Sosyal Fayda Dernegi <${TENANT1_DID}>

[tenant1-webrtc-100-auth]
type=auth
auth_type=userpass
username=${TENANT1_WEBRTC_USER}
password=${TENANT1_WEBRTC_PWD}

[tenant1-webrtc-100-aor]
type=aor
max_contacts=3           ; aynı kullanıcı birden fazla sekme/cihazdan kaydolabilir
remove_existing=yes
qualify_frequency=30

;------------------------------------------------------------------------------
; (c) Pasifik operatör trunk'ı — outbound registration + UDP 5060
;------------------------------------------------------------------------------
[tenant1-pasifik-trunk]
type=endpoint
transport=transport-udp
context=tenant1-from-pstn      ; trunk'tan GELEN çağrılar buraya düşer
disallow=all
allow=ulaw,alaw                ; PSTN tarafı: opus yok, ulaw/alaw
outbound_auth=tenant1-pasifik-auth
aors=tenant1-pasifik-aor
from_user=${PASIFIK_EXT_100}
from_domain=${PASIFIK_HOST}
direct_media=no                ; medya geçitten akar (transcoding/NAT için şart)
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733              ; operatör tarafı: standart out-of-band DTMF (IVR güvenilirliği)

[tenant1-pasifik-auth]
type=auth
auth_type=userpass
username=${PASIFIK_EXT_100}
password=${PASIFIK_PWD_100}

[tenant1-pasifik-aor]
type=aor
contact=sip:${PASIFIK_HOST}:${PASIFIK_PORT}
qualify_frequency=60

[tenant1-pasifik-reg]
type=registration
transport=transport-udp
outbound_auth=tenant1-pasifik-auth
server_uri=sip:${PASIFIK_HOST}:${PASIFIK_PORT}
client_uri=sip:${PASIFIK_EXT_100}@${PASIFIK_HOST}:${PASIFIK_PORT}
contact_user=${PASIFIK_EXT_100}
retry_interval=60
forbidden_retry_interval=300
expiration=3600
line=yes
endpoint=tenant1-pasifik-trunk

; Bu endpoint, Pasifik IP'sinden gelen istekleri trunk olarak tanır
; (IP-tabanlı identify; auth ayrıca outbound_auth ile yapılır).
[tenant1-pasifik-identify]
type=identify
endpoint=tenant1-pasifik-trunk
match=${PASIFIK_HOST}

;==============================================================================
; YENİ KİRACI EKLEME DESENİ
;------------------------------------------------------------------------------
; tenants/ altına tenantN.conf.example kopyala, "tenant1" -> "tenantN",
; santral.env'e PASIFIK_*/TENANTN_* değişkenlerini ekle, setup.sh tekrar çalıştır.
; Detay: tenants/README'siz — desen için tenants/tenant.conf.example dosyasına bak.
;==============================================================================
#include /etc/asterisk/pjsip.d/*.conf
