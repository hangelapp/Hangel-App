;==============================================================================
; hangel — RTP taşıma ayarları (rtp.conf)
;------------------------------------------------------------------------------
; Medya (ses) portları ve güvenlik. setup.sh bunu /etc/asterisk/rtp.conf olarak
; yazar. Port aralığı firewall'da UDP olarak açık olmalı (setup.sh açar).
;==============================================================================

[general]
; RTP port aralığı — WebRTC + trunk medyası bu portlardan akar.
rtpstart=10000
rtpend=20000

; Yalnız görüşülen (negotiate edilen) kaynaktan RTP kabul et — araya paket
; enjeksiyonunu (RTP injection) engeller. WebRTC ile uyumlu.
strictrtp=yes

; ICE için STUN sunucusu (aday adres keşfi). Google STUN — ücretsiz, güvenilir.
stunaddr=stun.l.google.com:19302

; ICMP ile hızlı hata tespiti (karşı port kapandıysa erken anla).
icesupport=yes
