;==============================================================================
; hangel — Santral dialplan (extensions.conf)
;------------------------------------------------------------------------------
; Bu dosya ŞABLONDUR. setup.sh, ${VAR} değişkenlerini santral.env'den yerleştirip
; /etc/asterisk/extensions.conf olarak yazar.
;
; Çok-kiracılı: her kiracının tarayıcı çağrıları kendi "from-browser" context'ine,
; gelen DID çağrıları kendi "from-pstn" context'ine düşer. Context'ler kiracılar
; arası izolasyonu (bir kiracı diğerinin trunk'ını çeviremez) sağlar.
;==============================================================================

[globals]
TENANT1_DID=${TENANT1_DID}

;==============================================================================
; KİRACI 1 — Sosyal Fayda Derneği
;==============================================================================

;------------------------------------------------------------------------------
; (a) GİDEN: tarayıcı bir numara çevirir -> Pasifik trunk üzerinden dışarı
;------------------------------------------------------------------------------
[tenant1-from-browser]
; Türkiye numaraları / genel dış arama.
; Numara normalizasyonu: tarayıcıdan +90XXX / 0090XXX / 0XXX gelebilir; hepsini
; trunk'ın beklediği 90XXXXXXXXXX biçimine çevir. (Aksi halde trunk INVITE'ı
; reddeder ve çağrı ~1 sn'de düşer.)
;
; 1) +90XXX veya +XXX  → baştaki '+' SIP.js tarafında zaten soyulur; yine de
;    Asterisk'e '+' geldiyse eşleşsin diye ayrı pattern ekliyoruz.
; 2) 0090XXX (00 uluslararası önek) → 90XXX
; 3) 0XXX (ulusal) → 90XXX
; 4) 90XXX / diğer → olduğu gibi.
exten => _+X.,1,NoOp(hangel: giden (+ onekli) -> ${EXTEN})
 same => n,Set(NUM=${EXTEN:1})
 same => n,Goto(tenant1-dial,${NUM},1)
exten => _00X.,1,NoOp(hangel: giden (00 onekli) -> ${EXTEN})
 same => n,Set(NUM=${EXTEN:2})
 same => n,Goto(tenant1-dial,${NUM},1)
exten => _0X.,1,NoOp(hangel: giden (0 ulusal) -> ${EXTEN})
 same => n,Set(NUM=90${EXTEN:1})
 same => n,Goto(tenant1-dial,${NUM},1)
exten => _X.,1,NoOp(hangel: giden -> ${EXTEN})
 same => n,Goto(tenant1-dial,${EXTEN},1)

; Ortak çevirme context'i — normalize edilmiş numarayı trunk'a gönderir.
[tenant1-dial]
exten => _X.,1,NoOp(hangel santral: KIRACI1 giden cagri -> ${EXTEN})
 same => n,Set(CALLERID(num)=${TENANT1_DID})
 ; Adaptive jitter buffer — WebRTC<->PSTN arası ses titremesini/kesikliğini azaltır.
 same => n,Set(JITTERBUFFER(adaptive)=default)
 same => n,Dial(PJSIP/${EXTEN}@tenant1-pasifik-trunk,60)
 same => n,Hangup()

;------------------------------------------------------------------------------
; (b) GELEN: Pasifik DID 902167080216 -> tarayıcı endpoint'ini çaldır
;------------------------------------------------------------------------------
[tenant1-from-pstn]
; Pasifik trunk'tan gelen çağrı → çağrı akışı AGI köprüsüne. AGI, hangel
; resolve API'sinden panelde tanımlı akışı (IVR/sıra/voicemail/mesai/yönlendirme)
; alıp uygular. callFlow kapalıysa API 'default-ring' döner → normal telefon
; gibi tarayıcı panelini çaldırır (eski davranışın aynısı, kesinti yok).
exten => ${TENANT1_DID},1,NoOp(hangel santral: KIRACI1 gelen cagri DID ${EXTEN})
 same => n,AGI(hangel-callflow.py,${EXTEN},tenant1-webrtc-100)
 same => n,Hangup()

exten => ${PASIFIK_EXT_100},1,AGI(hangel-callflow.py,${EXTEN},tenant1-webrtc-100)
 same => n,Hangup()

; DID/dahili eşleşmezse yine de akış köprüsüne düşür.
exten => _X.,1,AGI(hangel-callflow.py,${EXTEN},tenant1-webrtc-100)
 same => n,Hangup()

; Geriye dönük: doğrudan tarayıcıyı çaldıran basit context (AGI devre dışı
; kalırsa acil fallback olarak elle Goto edilebilir).
[tenant1-ring-browser]
exten => s,1,NoOp(hangel santral: KIRACI1 tarayici endpoint caliniyor)
 same => n,Dial(PJSIP/tenant1-webrtc-100,30)
 same => n,Hangup()

;==============================================================================
; YENİ KİRACI: yukarıdaki üç context'i ("from-browser", "from-pstn",
; "ring-browser") kopyala, tenant1 -> tenantN yap; pjsip.conf'taki endpoint
; isimleriyle eşleştir.
;==============================================================================
#include extensions.d/*.conf
