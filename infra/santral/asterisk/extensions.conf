;==============================================================================
; hangel — Santral dialplan (extensions.conf)
;------------------------------------------------------------------------------
; Bu dosya ŞABLONDUR. setup.sh, ${VAR} değişkenlerini santral.env'den yerleştirip
; /etc/asterisk/extensions.conf olarak yazar.
;
; Çok-kiracılı: her kiracının tarayıcı çağrıları kendi "from-browser" context'ine,
; gelen DID çağrıları kendi "from-pstn" context'ine düşer. Context'ler kiracılar
; arası izolasyonu (bir kiracı diğerinin trunk'ını çeviremez) sağlar.
;==============================================================================

[globals]
TENANT1_DID=${TENANT1_DID}

;==============================================================================
; KİRACI 1 — Sosyal Fayda Derneği
;==============================================================================

;------------------------------------------------------------------------------
; (a) GİDEN: tarayıcı bir numara çevirir -> Pasifik trunk üzerinden dışarı
;------------------------------------------------------------------------------
[tenant1-from-browser]
; Türkiye numaraları / genel dış arama.
; Çevrilen numarayı olduğu gibi Pasifik trunk'ına gönder.
; (İsteğe bağlı normalizasyon: 0XXX -> 90XXX dönüşümü burada yapılabilir.)
exten => _X.,1,NoOp(hangel santral: KIRACI1 giden cagri -> ${EXTEN})
 same => n,Set(CALLERID(num)=${TENANT1_DID})
 same => n,Dial(PJSIP/${EXTEN}@tenant1-pasifik-trunk,60)
 same => n,Hangup()

;------------------------------------------------------------------------------
; (b) GELEN: Pasifik DID 902167080216 -> tarayıcı endpoint'ini çaldır
;------------------------------------------------------------------------------
[tenant1-from-pstn]
; Pasifik trunk'tan gelen çağrı DID'e (veya dahili 100'e) hedeflenir.
exten => ${TENANT1_DID},1,NoOp(hangel santral: KIRACI1 gelen cagri DID ${EXTEN})
 same => n,Goto(tenant1-ring-browser,s,1)

exten => ${PASIFIK_EXT_100},1,Goto(tenant1-ring-browser,s,1)

; DID/dahili eşleşmezse yine de tarayıcıyı çaldır (tek-endpoint kiracı).
exten => _X.,1,Goto(tenant1-ring-browser,s,1)

[tenant1-ring-browser]
exten => s,1,NoOp(hangel santral: KIRACI1 tarayici endpoint caliniyor)
 same => n,Dial(PJSIP/tenant1-webrtc-100,30)
 same => n,Hangup()

;==============================================================================
; YENİ KİRACI: yukarıdaki üç context'i ("from-browser", "from-pstn",
; "ring-browser") kopyala, tenant1 -> tenantN yap; pjsip.conf'taki endpoint
; isimleriyle eşleştir.
;==============================================================================
#include extensions.d/*.conf
