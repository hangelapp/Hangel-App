# =============================================================================
# hangel — Santral coturn (TURN/STUN) konfigürasyonu
# -----------------------------------------------------------------------------
# Bu dosya ŞABLONDUR. setup.sh, ${VAR} değişkenlerini santral.env'den yerleştirip
# /etc/turnserver.conf olarak yazar.
#
# TURN, tarayıcının (SIP.js/WebRTC) simetrik NAT arkasındayken medya akıtmasını
# sağlar. Asterisk ICE ile bu sunucuyu aday olarak kullanır.
# =============================================================================

# --- Kimlik / realm ----------------------------------------------------------
realm=${DOMAIN}
server-name=${DOMAIN}

# --- Dinleme portları --------------------------------------------------------
listening-port=3478
tls-listening-port=5349

# Tüm arayüzlerde dinle (VM tek IP). Gerekirse listening-ip ile sabitle.
# listening-ip=0.0.0.0

# Dış IP: VM'in public IP'si. setup.sh bunu otomatik tespit edip ekler;
# elle de yazılabilir:  external-ip=X.X.X.X
# external-ip=${EXTERNAL_IP}

# --- TLS (Let's Encrypt — santral DNS'i ile aynı sertifika) ------------------
cert=/etc/letsencrypt/live/${DOMAIN}/fullchain.pem
pkey=/etc/letsencrypt/live/${DOMAIN}/privkey.pem

# --- Kimlik doğrulama --------------------------------------------------------
# YÖNTEM A (önerilen): zaman-sınırlı paylaşılan secret (HMAC).
# Tarayıcı/SIP.js geçici credential üretir; secret sızsa bile kötüye kullanım sınırlı.
use-auth-secret
static-auth-secret=${TURN_SECRET}

# YÖNTEM B (alternatif): statik long-term kullanıcı.
# Yöntem A kullanıyorsan AŞAĞIDAKİ iki satırı yorumda bırak.
# lt-cred-mech
# user=${TURN_USER}:${TURN_PWD}

# --- Relay port aralığı (RTP) ------------------------------------------------
min-port=49152
max-port=65535

# --- Güvenlik / sağlamlaştırma ----------------------------------------------
fingerprint
no-tcp-relay=false

# Loopback / özel ağlara relay'i engelle (SSRF / iç ağ koruması).
no-loopback-peers
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# CLI'yi kapat (uzaktan yönetim riski).
no-cli

# Loglama
log-file=/var/log/turnserver/turnserver.log
simple-log
