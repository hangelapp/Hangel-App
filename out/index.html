<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hangel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: #1a1a1a;
    }
    .loader {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid #e5e7eb;
      border-top-color: #FF7F50;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    .loader p {
      font-size: 1rem;
      color: #6b7280;
    }
    .offline-msg {
      display: none;
      margin-top: 1rem;
      font-size: 0.875rem;
      color: #ef4444;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p id="status">Hangel yükleniyor...</p>
    <p class="offline-msg" id="offline-msg">
      İnternet bağlantınızı kontrol edin ve tekrar deneyin.
    </p>
  </div>
  <script>
    window.addEventListener('offline', function() {
      document.getElementById('offline-msg').style.display = 'block';
      document.getElementById('status').textContent = 'Bağlantı kesildi';
    });
    window.addEventListener('online', function() {
      document.getElementById('offline-msg').style.display = 'none';
      document.getElementById('status').textContent = 'Hangel yükleniyor...';
      window.location.reload();
    });
    if (!navigator.onLine) {
      document.getElementById('offline-msg').style.display = 'block';
      document.getElementById('status').textContent = 'Bağlantı kesildi';
    }
  </script>
</body>
</html>
