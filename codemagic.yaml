# Codemagic CI/CD workflow — Hangel iOS
#
# Cloud Mac (M2) üzerinde modern Xcode ile build alır, IPA üretir, App Store
# Connect'e (TestFlight) yükler. macOS Monterey + Xcode 14 lokal ortamı yerine
# bu workflow App Store submission için modern Xcode 15+ kullanır (Apple
# 2024 Nisan'dan beri iOS 17 SDK + Xcode 15 zorunlu).
#
# İlk kurulumda Codemagic dashboard'unda manuel eklenecekler:
#  1. App Store Connect API key (Integrations → Apple Developer Portal)
#  2. Apple Developer Account (Integrations → Developer Portal)
#  3. Environment variable group: app_store_credentials
#     - APP_STORE_CONNECT_PRIVATE_KEY (.p8 dosyası)
#     - APP_STORE_CONNECT_KEY_IDENTIFIER (Key ID)
#     - APP_STORE_CONNECT_ISSUER_ID (Issuer ID, Users and Access → Keys)
#
# Apphosting tarafı zaten otomatik deploy (App Hosting webhook on main).
# Bu yaml sadece iOS build için — web tarafına dokunmaz.

workflows:
  ios-testflight:
    name: Hangel iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.hangel.ios.app
        APP_STORE_APPLE_ID: 6664058822
      node: 22
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Build Next.js (static export to out/)
        script: |
          npm run build || true
          # Capacitor webDir 'out' fakat server.url=hangel.org.tr olduğu için
          # WebView canlı siteyi yükler. out/ dizini build sırasında lazım
          # (cap sync verify), runtime'da değil.

      - name: Capacitor sync iOS
        script: |
          npx cap sync ios

      - name: Resolve Swift Package Manager dependencies (CapApp-SPM)
        script: |
          # Capacitor 8.x SPM warm-up. Fresh resolve, default DerivedData
          # cache'ine yaz (archive bunu kullanır). Xcode 26'da stale
          # Package.resolved git'ten silindi, fresh regenerate olur.
          cd ios/App
          rm -rf ~/Library/Developer/Xcode/DerivedData/App-* 2>/dev/null || true
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App

      - name: Set bundle build number (auto-increment from TestFlight)
        script: |
          cd ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo "0")
          NEW_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          agvtool new-version -all $NEW_BUILD_NUMBER

      - name: Set up code signing
        script: |
          keychain initialize
          # Generate fresh RSA private key for distribution cert.
          # Bu key olmadan fetch-signing-files mevcut (revoked) cert'i bulup
          # 'Cannot save Signing Certificates without certificate private key'
          # hatası veriyor. Explicit key ile yeni cert + key pair oluşur.
          CERT_KEY_PATH=/tmp/distribution_cert_key.pem
          openssl genrsa -out "$CERT_KEY_PATH" 2048
          # Eski cert'leri revoke et — Apple max 2 dist cert limit, fresh cert
          # oluşturulamazsa 409 hatası. Filtre type-agnostic: hem IOS_DISTRIBUTION
          # hem DISTRIBUTION (yeni Apple managed type) yakalanır.
          echo "=== Listing existing certs (raw) ==="
          # Codemagic CLI v0.49+ prepends a banner ("Found N Signing
          # Certificates...") + deprecation notice before the JSON array,
          # which breaks jq. sed strips everything until the first [ or {.
          # Also: list-certificates is deprecated in favor of `certificates list`.
          app-store-connect certificates list --json 2>/dev/null | sed -n '/^[[{]/,$p' | head -200 || echo "list failed"
          echo "=== Extracting DISTRIBUTION cert IDs ==="
          CERTS=$(app-store-connect certificates list --json 2>/dev/null \
            | sed -n '/^[[{]/,$p' \
            | jq -r '.[] | select(.attributes.certificateType | tostring | contains("DISTRIBUTION")) | .id' \
            2>/dev/null || echo "")
          echo "DISTRIBUTION cert IDs: [$CERTS]"
          for cert_id in $CERTS; do
            echo "Revoking stale distribution cert: $cert_id"
            app-store-connect certificates delete "$cert_id" 2>/dev/null || \
              app-store-connect delete-certificate "$cert_id" 2>/dev/null || true
          done
          # Eski provisioning profile'ları sil — capability değişiklikleri
          # mevcut profile'lara otomatik yansımıyor.
          PROFILES=$(app-store-connect list-profiles --json 2>/dev/null \
            | sed -n '/^[[{]/,$p' \
            | jq -r '.[] | .id' 2>/dev/null || echo "")
          for profile_id in $PROFILES; do
            echo "Deleting stale provisioning profile: $profile_id"
            app-store-connect delete-profile "$profile_id" 2>/dev/null || true
          done
          # Her bundle için fetch-signing-files (--create).
          # Aynı --certificate-key kullanıldığında Codemagic CLI cert'i ilk
          # bundle'da oluşturur, sonraki bundle'larda re-use eder.
          # HangelLiveActivities target'ı widgets bundle kullanıyor (Apple
          # 'LiveActivities' adını reserved kabul ettiği için).
          for BID in "com.hangel.ios.app" "com.hangel.ios.app.watchapp" "com.hangel.ios.app.Clip" "com.hangel.ios.app.widgets"; do
            echo "=== fetch-signing-files: $BID ==="
            app-store-connect fetch-signing-files "$BID" \
              --type IOS_APP_STORE \
              --certificate-key=@file:"$CERT_KEY_PATH" \
              --create
          done

          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project --verbose build-ipa \
            --project "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # TestFlight metadata App Store Connect API üzerinden 2026-06-01'de
        # dolduruldu (scripts/automation/testflight-setup.ts).
        # Beta App Review Detail + Beta App Localization (tr) + Internal
        # Testers group hazır. Artık submit_to_testflight: true güvenli.
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
      email:
        recipients:
          - ismailhilmi@hangel.org
        notify:
          success: true
          failure: true
