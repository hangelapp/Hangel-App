# Codemagic CI/CD workflow — Hangel iOS
#
# Cloud Mac (M2) üzerinde modern Xcode ile build alır, IPA üretir, App Store
# Connect'e (TestFlight) yükler. macOS Monterey + Xcode 14 lokal ortamı yerine
# bu workflow App Store submission için modern Xcode 15+ kullanır (Apple
# 2024 Nisan'dan beri iOS 17 SDK + Xcode 15 zorunlu).
#
# İlk kurulumda Codemagic dashboard'unda manuel eklenecekler:
#  1. App Store Connect API key (Integrations → Apple Developer Portal)
#  2. Apple Developer Account (Integrations → Developer Portal)
#  3. Environment variable group: app_store_credentials
#     - APP_STORE_CONNECT_PRIVATE_KEY (.p8 dosyası)
#     - APP_STORE_CONNECT_KEY_IDENTIFIER (Key ID)
#     - APP_STORE_CONNECT_ISSUER_ID (Issuer ID, Users and Access → Keys)
#
# Apphosting tarafı zaten otomatik deploy (App Hosting webhook on main).
# Bu yaml sadece iOS build için — web tarafına dokunmaz.

workflows:
  ios-testflight:
    name: Hangel iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.hangel.ios.app
        APP_STORE_APPLE_ID: 6664058822
      node: 22
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Build Next.js (static export to out/)
        script: |
          npm run build || true
          # Capacitor webDir 'out' fakat server.url=hangel.org.tr olduğu için
          # WebView canlı siteyi yükler. out/ dizini build sırasında lazım
          # (cap sync verify), runtime'da değil.

      - name: Capacitor sync iOS
        script: |
          npx cap sync ios

      - name: Resolve Swift Package Manager dependencies (CapApp-SPM)
        script: |
          # Capacitor 8.x SPM warm-up. Fresh resolve, default DerivedData
          # cache'ine yaz (archive bunu kullanır). Xcode 26'da stale
          # Package.resolved git'ten silindi, fresh regenerate olur.
          cd ios/App
          rm -rf ~/Library/Developer/Xcode/DerivedData/App-* 2>/dev/null || true
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App

      - name: Set bundle build number (auto-increment from TestFlight)
        script: |
          cd ios/App
          # get-latest-app-store-build-number sadece "released" App Store
          # build'lerini sayıyor — TestFlight'a uploaded ama henüz live
          # olmayan build'leri kaçırıyor. Sonuç: çakışma (Build #71'de
          # bundleVersion 3 vs Apple "previousBundleVersion: 3" 409).
          # get-latest-testflight-build-number tüm uploaded build'leri içerir.
          LATEST_TESTFLIGHT=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          LATEST_APP_STORE=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          # En yüksek olanı al + 1
          if [ "$LATEST_TESTFLIGHT" -gt "$LATEST_APP_STORE" ]; then
            LATEST_BUILD_NUMBER=$LATEST_TESTFLIGHT
          else
            LATEST_BUILD_NUMBER=$LATEST_APP_STORE
          fi
          NEW_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          echo "TestFlight latest: $LATEST_TESTFLIGHT, App Store latest: $LATEST_APP_STORE, new: $NEW_BUILD_NUMBER"
          agvtool new-version -all $NEW_BUILD_NUMBER

      - name: Set up code signing (Xcode automatic signing)
        script: |
          keychain initialize
          # ─────────────────────────────────────────────────────────────
          # WORKAROUND: com.apple.developer.usernotifications.time-sensitive
          # entitlement Apple App Store Connect API'nin POST
          # /v1/bundleIdCapabilities endpoint'inde DESTEKLENMİYOR. Apple
          # 2024'te bu capability'yi "Xcode-managed" listesine taşıdı —
          # sadece Xcode (services2 endpoint) profile oluştururken bu
          # entitlement'ı kapsayabilir. fetch-signing-files App Store Connect
          # API'sini kullandığı için bu entitlement'lı profile yaratamıyor,
          # sonuç: Build IPA fail (provisioning profile entitlement mismatch).
          #
          # Çözüm: Xcode'un kendi automatic signing'ini kullan.
          #   1. App Store Connect API key'ini xcodebuild'e geç (--allowProvisioningUpdates)
          #   2. Distribution cert'i fetch-signing-files DEĞİL fetch-distribution
          #      cert komutuyla al (yalnız cert, profile yok)
          #   3. xcodebuild -allowProvisioningUpdates kendisi services2 endpoint'inden
          #      time-sensitive entitlement'lı profile yaratır.
          #
          # Eski yöntem (Method B - manual mobileprovision) docs/audit/runbooks/
          # ios-signing-time-sensitive.md'de açıklandı.
          # ─────────────────────────────────────────────────────────────

          # Generate fresh RSA private key for distribution cert.
          CERT_KEY_PATH=/tmp/distribution_cert_key.pem
          openssl genrsa -out "$CERT_KEY_PATH" 2048

          # Eski cert'leri revoke et — Apple max 2 dist cert limit
          echo "=== Listing existing certs ==="
          CERTS=$(app-store-connect list-certificates --json | jq -r '.[] | select(.attributes.certificateType | tostring | contains("DISTRIBUTION")) | .id' || echo "")
          echo "DISTRIBUTION cert IDs to revoke: $CERTS"
          for cert_id in $CERTS; do
            echo "Revoking stale distribution cert: $cert_id"
            app-store-connect delete-certificate "$cert_id" || true
          done

          # Eski provisioning profile'ları sil (Apple Console capability listesi
          # değişince mevcut profile'lar stale kalır)
          PROFILES=$(app-store-connect list-profiles --json 2>/dev/null \
            | jq -r ".[] | select(.attributes.bundleId.identifier == \"$BUNDLE_ID\") | .id" 2>/dev/null || echo "")
          for profile_id in $PROFILES; do
            echo "Deleting stale provisioning profile: $profile_id"
            app-store-connect delete-profile "$profile_id" || true
          done

          # Fresh distribution cert oluştur — SADECE cert, profile YOK.
          # `app-store-connect create-certificate` (or `fetch-signing-files
          # --no-profiles`) profile oluşturmaz. fetch-signing-files'in
          # --create flag'i profile da yaratıyordu; bu kez yaratmıyoruz.
          # xcodebuild -allowProvisioningUpdates kendi profile'ını üretir.
          app-store-connect create-certificate \
            --type IOS_DISTRIBUTION \
            --certificate-key=@file:"$CERT_KEY_PATH" \
            --save || {
              # Older codemagic-cli-tools versions: fetch-signing-files olmadan
              # cert oluşturma için --no-create-profiles flag'i de var.
              echo "create-certificate failed, falling back to fetch-signing-files with --no-create-profile"
              app-store-connect fetch-signing-files "$BUNDLE_ID" \
                --type IOS_APP_STORE \
                --certificate-key=@file:"$CERT_KEY_PATH" \
                --create \
                --strict-match-identifier || true
            }
          keychain add-certificates

          # App Store Connect API key'ini xcodebuild için disk'e yaz.
          # xcodebuild -authenticationKeyPath bu dosyayı okuyup
          # services2.apple.com endpoint'iyle profile yaratır (time-sensitive
          # entitlement dahil tüm capability'leri otomatik ekler).
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8

      - name: Build IPA (Xcode automatic signing)
        script: |
          # xcodebuild ile automatic signing — -allowProvisioningUpdates flag'i
          # Xcode'a "eksik profile'ları services2 endpoint üzerinden yarat"
          # talimatı verir. Bu endpoint time-sensitive entitlement'ı destekler.
          set -ex
          cd ios/App
          export DEVELOPMENT_TEAM=NKZNY8NU8S

          # ExportOptions.plist - automatic signing için
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>NKZNY8NU8S</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>destination</key>
              <string>export</string>
              <key>uploadSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          # Archive — automatic signing ile, App Store Connect API key
          # kullanarak. -allowProvisioningUpdates Xcode'un eksik
          # profile'ları yaratmasını sağlar (services2 endpoint).
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath /tmp/build/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=NKZNY8NU8S \
            archive

          # IPA export
          xcodebuild -exportArchive \
            -archivePath /tmp/build/App.xcarchive \
            -exportPath /tmp/build/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

          # Codemagic'in beklediği yere kopyala (CM_BUILD_DIR/build/ios/ipa)
          mkdir -p "$CM_BUILD_DIR/build/ios/ipa"
          cp /tmp/build/ipa/*.ipa "$CM_BUILD_DIR/build/ios/ipa/" 2>/dev/null \
            || cp /tmp/build/ipa/App.ipa "$CM_BUILD_DIR/build/ios/ipa/Hangel.ipa"
          ls -la "$CM_BUILD_DIR/build/ios/ipa/"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # TestFlight metadata App Store Connect API üzerinden 2026-06-01'de
        # dolduruldu (scripts/automation/testflight-setup.ts).
        # Beta App Review Detail + Beta App Localization (tr) + Internal
        # Testers group hazır. Artık submit_to_testflight: true güvenli.
        submit_to_testflight: true
        beta_groups:
          - Hangel Team
      email:
        recipients:
          - ismailhilmi@hangel.org
        notify:
          success: true
          failure: true
