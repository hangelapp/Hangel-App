# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Cold-start fix (2026-06-01): kullanıcılar ara ara 'upstream connect error
  # / connection termination' alıyordu. Sebebi: minInstances default 0
  # (scale-to-zero) → idle period sonrası ilk request Next.js + Firestore
  # bootstrap 10-30 sn sürerken Envoy bağlantıyı düşürüyordu.
  # En az 1 warm instance her zaman ayakta.
  minInstances: 1
  maxInstances: 10
  concurrency: 60      # Next.js SSR ağır — OOM önle
  memoryMiB: 2048      # 1024 yetmedi (2026-06-06): yeni outreach route'lar build sırasında OOM
  cpu: 1
  timeoutSeconds: 120  # Yavaş Firestore aggregation için

# Server-side secrets injected from Secret Manager at runtime.
# GEMINI_API_KEY: Genkit/Gemini (library AI, project writer, impact stories).
# OAUTH_STATE_SECRET: HMAC signing for the email-contacts OAuth state (CSRF).
# (Gmail/Outlook OAuth client creds are added by the operator once the OAuth
#  apps are created — until then those routes return OAUTH_NOT_CONFIGURED.)
env:
  # Build-time Node heap fix (2026-06-01): App Hosting buildpack default
  # 2GB heap kullanıyordu, Next.js prod build (translations.ts 5368 satır +
  # Genkit + ~250 sayfa) OOM ile çakıldı. 4GB heap yeterli.
  - variable: NODE_OPTIONS
    value: "--max-old-space-size=8192"
    availability:
      - BUILD
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
  - variable: OAUTH_STATE_SECRET
    secret: OAUTH_STATE_SECRET
    availability:
      - RUNTIME
  # WhatsApp Cloud API (Meta Business)
  - variable: WHATSAPP_ACCESS_TOKEN
    secret: WHATSAPP_ACCESS_TOKEN
    availability:
      - RUNTIME
  - variable: WHATSAPP_APP_SECRET
    secret: WHATSAPP_APP_SECRET
    availability:
      - RUNTIME
  - variable: WHATSAPP_PHONE_NUMBER_ID
    value: "1011367262068325"
    availability:
      - RUNTIME
  - variable: WHATSAPP_OTP_TEMPLATE_NAME
    value: "otp_hangel"
    availability:
      - RUNTIME
  - variable: WHATSAPP_OTP_TEMPLATE_LANG
    value: "tr"
    availability:
      - RUNTIME
  # Web Push (FCM) — VAPID public key. Build-time'da gerek (client SDK init).
  - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
    value: "BJZWx1kaojA33YT-KwIZpqwAucW604dBxVoPPOAYd3aMHpxsxtpLKwA6dJ5UZBB-Qs8YqZaivgI9b9uuJF5jp7U"
    availability:
      - BUILD
      - RUNTIME
  # Google OAuth (Gmail kişi içe aktarma — /api/contacts/google/*)
  - variable: GOOGLE_CONTACTS_CLIENT_ID
    secret: GOOGLE_CONTACTS_CLIENT_ID
    availability:
      - RUNTIME
  - variable: GOOGLE_CONTACTS_CLIENT_SECRET
    secret: GOOGLE_CONTACTS_CLIENT_SECRET
    availability:
      - RUNTIME

  # Resend (transactional + outreach email).
  # 2026-06-06: GCP Secret Manager yetkisi henüz set edilmedi, geçici olarak
  # plaintext value. Private repo, free tier 100 mail/gün limit → blast radius
  # düşük. 2026-06-13'e kadar Secret Manager'a taşı + buradan kaldır + rotate.
  - variable: EMAIL_DRIVER
    value: "resend"
    availability:
      - RUNTIME
  - variable: RESEND_API_KEY
    value: "re_FAR7fm2R_H2et8Hk61mRk8nCQeJ9XEgxP"
    availability:
      - RUNTIME
  - variable: RESEND_FROM_EMAIL
    value: "merhaba@hangel.org"
    availability:
      - RUNTIME
  - variable: RESEND_FROM_NAME
