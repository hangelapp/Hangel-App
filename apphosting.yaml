# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # MALİYET (2026-07-08): minInstances:1 + 2GB warm instance 7/24 açık kalınca
  # App Engine/Cloud Run faturası ~₺8.45K/ay'a çıkmıştı (Haziran ~₺0 → Temmuz patlama,
  # site 07-04'te canlıya çıkınca). Scale-to-zero'ya döndük: idle'da 0 instance =
  # 0 maliyet. Trafik gelince otomatik açılır.
  #
  # Cold-start notu (2026-06-01): eskiden idle sonrası ilk istek 10-30 sn bootstrap
  # + Envoy 'connection termination' veriyordu. minInstances:0 ile bu geri gelebilir;
  # olursa çözüm minInstances:1'e dönmek DEĞİL (pahalı), memoryMiB'ı düşürüp
  # (512-1024) 1 warm instance tutmak — çok daha ucuz. Önce maliyeti kesiyoruz.
  # SERT MALİYET TAVANI (2026-07-08, kullanıcı isteği "aşmayı engelle"):
  # Google Cloud harcamayı belirli bir tutarda OTOMATİK kesemez (bütçe yalnız
  # uyarır). Maliyeti FİZİKSEL sınırlamanın gerçek yolu instance sayısını
  # kısmaktır: maxInstances:1 → aynı anda en fazla 1 sunucu → App Engine/Cloud Run
  # instance-saat maliyeti patlayamaz (paralel N instance × saat ücreti olamaz).
  # Trafik artarsa site YAVAŞLAR (istekler kuyruğa girer) ama ÇÖKMEZ ve maliyet
  # tavanlı kalır. minInstances:0 → idle'da sıfır maliyet.
  minInstances: 0
  maxInstances: 1      # SERT TAVAN: paralel instance yok → maliyet patlaması fiziksel olarak imkansız
  concurrency: 80      # Tek instance daha çok eşzamanlı isteği karşılasın (site yavaşlamasın)
  memoryMiB: 2048      # SSR + Genkit runtime için 2GB'da kal (1024 OOM riski → site çöker); asıl fren maxInstances:1
  cpu: 1
  timeoutSeconds: 120  # Yavaş Firestore aggregation için

# Server-side secrets injected from Secret Manager at runtime.
# GEMINI_API_KEY: Genkit/Gemini (library AI, project writer, impact stories).
# OAUTH_STATE_SECRET: HMAC signing for the email-contacts OAuth state (CSRF).
# (Gmail/Outlook OAuth client creds are added by the operator once the OAuth
#  apps are created — until then those routes return OAUTH_NOT_CONFIGURED.)
env:
  # Build-time Node heap fix (2026-06-01): App Hosting buildpack default
  # 2GB heap kullanıyordu, Next.js prod build (translations.ts 5368 satır +
  # Genkit + ~250 sayfa) OOM ile çakıldı. 4GB heap yeterli.
  - variable: NODE_OPTIONS
    value: "--max-old-space-size=8192"
    availability:
      - BUILD
  - variable: GEMINI_API_KEY
    value: "REPLACE_IN_SECRET_MANAGER_LATER"
    availability:
      - RUNTIME
  - variable: OAUTH_STATE_SECRET
    value: "REPLACE_IN_SECRET_MANAGER_LATER"
    availability:
      - RUNTIME
  # STK Workspace toplu mail — per-STK SMTP App Password'ları AES-256-GCM ile
  # şifreleyen master anahtar (Secret Manager, App Hosting'e grant verildi).
