# Hangel iOS — Market sayfasında STK/marka gezinti
# Login olduktan sonra çalışır (state previous test'ten gelir).

appId: com.hangel.ios.app
---

- launchApp:
    permissions:
      all: allow

# Market sayfasına git (alt nav)
- tapOn:
    text: ".*[Mm]arket.*"
    optional: true

- waitForAnimationToEnd:
    timeout: 5000

# Marka listesi görünmeli
- assertVisible:
    text: ".*Markalar.*"
    optional: true

# İlk markaya tıkla
- tapOn:
    index: 0
    optional: true

# Detay sayfası
- assertVisible:
    text: ".*bağış oranı.*"
    optional: true

# Geri dön
- tapOn:
    text: "←"
    optional: true
